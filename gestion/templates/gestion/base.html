<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Gestión comercial{% endblock %}</title>
  <!-- Bootstrap 5 vía CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Barra de navegación principal -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'inicio' %}">Comercio</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{% url 'producto_lista' %}">Productos</a>
        <a class="nav-link" href="{% url 'prenda_lista' %}">Prendas</a>
        <a class="nav-link" href="{% url 'cliente_lista' %}">Clientes</a>
        <a class="nav-link" href="{% url 'alquiler_lista' %}">Alquileres</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- Mensajes de Django (creado, editado, eliminado...) -->
    {% if messages %}
      {% for mensaje in messages %}
        <div class="alert alert-success">{{ mensaje }}</div>
      {% endfor %}
    {% endif %}

    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
